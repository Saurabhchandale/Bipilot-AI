
name: CICD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install exact dependencies from package-lock.json
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests if a test script exists
      - name: Run Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script found. Skipping tests."
          fi

      # 5. Build the application
      - name: Build Application
        run: npm run build

      # 6. Save the production build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deployment Placeholder
    runs-on: ubuntu-latest
    needs: build-and-test

    # Run only after a successful push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Status
        run: |
          echo "CI passed successfully."
          echo "Production build artifact is available."
          echo "Connect a deployment provider to publish the app."
