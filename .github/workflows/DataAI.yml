
name: BiPilot AI - CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Validate Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            echo "No requirements.txt found"
            exit 1
          fi
          pip install pytest

      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      - name: Run Automated Tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          elif [ -d backend/tests ]; then
            pytest backend/tests/ -v
          elif [ -d __tests__ ]; then
            pytest __tests__/ -v
          else
            echo "No recognized test directory found."
            echo "Add automated tests to enable test validation."
          fi

      - name: CI Success
        run: echo "BiPilot AI validation completed."
